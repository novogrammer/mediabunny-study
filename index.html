<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mediabunny-study</title>
  </head>
  <body>
    <div id="app">
      <label for="renderer-select">レンダラー</label>
      <select id="renderer-select">
        <option value="canvas2d">Canvas 2D</option>
        <option value="webgl">WebGL (Three.js)</option>
        <option value="webgpu">WebGPU (Three.js)</option>
      </select>
      <div id="preview"></div>
      <p id="preview-error" role="alert" hidden></p>
      <button id="export-button" type="button">Export MP4</button>
      <progress id="export-progress" max="1" value="0" aria-label="フレーム処理の進捗"></progress>
      <a id="download-link" download="output.mp4" hidden>MP4をダウンロード</a>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
